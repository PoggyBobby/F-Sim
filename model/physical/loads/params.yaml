namespace: loads
order: 70
title: "LOAD TRANSFER"

about: >
  Load transfer. The front/rear split is derived from the report's spring
  rates; the two rates are entered so the ratio is visible and refinable.

spring_rate_front:
  label:  "Front spring rate"
  value:  19.3
  unit:   N/mm
  display_unit: N/m (entered as N/mm)
  symbol: ks_f
  status: FROM REPORT
  what:   Front suspension spring rate. The planar plant uses only its ratio to the rear; the full plant's suspension/params.yaml derives the front wheel rate from it.
  need:   Front roll stiffness incl. ARBs and motion ratios
  how:    Suspension team
  why:    Numerator of the lateral load-transfer split.
  note: >
    Report spring units say "N/m"; clearly N/mm (2026-10-22: unit set to N/mm
    so the full plant can use the rate itself; the planar plant's ratio is
    unchanged by the conversion).

spring_rate_rear:
  label:  "Rear spring rate"
  value:  24.8
  unit:   N/mm
  display_unit: N/m (entered as N/mm)
  symbol: ks_r
  status: FROM REPORT
  what:   Rear suspension spring rate. The planar plant uses only its ratio to the front; the full plant derives the rear wheel rate from it.
  need:   Rear roll stiffness incl. ARBs and motion ratios
  how:    Suspension team
  why:    Denominator half of the lateral load-transfer split.

lat_transfer_frac_front:
  label:  "Front lateral-transfer fraction"
  derived: loads.spring_rate_front / (loads.spring_rate_front + loads.spring_rate_rear)
  unit:   "-"
  display_unit: 0-1
  symbol: "-"
  status: FROM REPORT (spring-rate ratio only) — crude
  what: >
    Share of total LATERAL load transfer reacted by the FRONT axle, set by the
    front/rear roll-stiffness split.
  need:   Front vs rear roll stiffness
  how: >
    Suspension team: roll rates including ARBs, motion ratios and roll-center
    heights
  why: >
    Which axle eats the load transfer = which axle loses grip first — trades
    understeer/oversteer at the limit.
  note: >
    Crude: with equal tracks the split is approximated as
    ks_f/(ks_f + ks_r) = 19.3/(19.3+24.8) = 0.438, ignoring ARBs, motion ratios
    and roll-center heights.
