namespace: numerical
order: 120
title: "NUMERICAL GUARDS"

about: >
  Not car data — solver guards. Leave alone unless the sim misbehaves.

v_eps:
  label:  "Low-speed guard"
  value:  0.5
  unit:   m/s
  symbol: v_eps
  status: NUMERICAL GUARD
  what:   Minimum speed used in slip-angle / slip-ratio denominators.
  need:   "-"
  how:    "-"
  why: >
    Below ~0.5 m/s wheel-slip math is untrustworthy — launches are out of scope
    until reworked.

w_eps:
  label:  "Wheel-speed guard"
  value:  5.0
  unit:   rad/s
  symbol: w_eps
  status: NUMERICAL GUARD
  what: >
    Floor on |wheel speed| when converting a per-motor POWER limit into a
    torque limit (T_lim = P_peak / max(|omega|, w_eps)).
  need:   Nothing (numerical)
  how:    "-"
  why: >
    P = T*omega, so at standstill the power limit permits infinite torque.
    Flooring the divisor caps it at P_peak/w_eps instead, which the per-wheel
    peak-torque limit then covers. 5 rad/s is ~1.1 m/s of ground speed, below
    the regen cutoff, so it never binds while the car is actually driving.

# ── full plant (vehicle17.py) ────────────────────────────────────────────────

v_smooth:
  label:  "Friction sign smoothing speed"
  value:  0.05
  unit:   m/s
  symbol: v_sm
  status: NUMERICAL GUARD
  what:   Velocity scale of the tanh() that replaces sign() in Coulomb friction (rack friction, rolling resistance).
  need:   "-"
  how:    "-"
  why:    A hard sign() flips every sub-step at rest and stalls RK4.

w_smooth:
  label:  "Brake sign smoothing speed"
  value:  0.5
  unit:   rad/s
  symbol: w_sm
  status: NUMERICAL GUARD
  what:   Wheel-speed scale of the tanh() that gives brake and bearing torque their sign.
  need:   "-"
  how:    "-"
  why:    Lets a braked wheel come to rest instead of chattering about zero.
