namespace: geometry
order: 30
title: "GEOMETRY & CG"

about: >
  Whole-vehicle geometry and CG. The sim is a single rigid body, so these are
  vehicle values, not sprung-mass values.

wheelbase:
  label:  "Wheelbase"
  value:  1.52
  unit:   m
  symbol: L
  status: FROM REPORT (2023 car)
  what:   Front-axle to rear-axle centerline distance.
  need:   Axle-center to axle-center distance
  how:    Tape measure / CAD
  why:    Sets yaw geometry, the bicycle-model reference, and CG position math.
  note: >
    Report L_f + L_r = 0.64 + 0.88. The report's sprung-CG distances sum to
    1.524 — 4 mm off; the vehicle-CG pair is used here.

track_front:
  label:  "Front track"
  value:  1.34
  unit:   m
  symbol: t_f
  status: FROM REPORT
  what: >
    Front track width — distance between the CENTERS of the two front tire
    contact patches (NOT outside-to-outside of the tires).
  need:   Center-of-tire to center-of-tire, front
  how:    Tape measure / CAD
  why:    Lever arm for front lateral load transfer.

track_rear:
  label:  "Rear track"
  value:  1.34
  unit:   m
  symbol: t_r
  status: FROM REPORT
  what:   Rear track width, same definition as front.
  need:   Center-of-tire to center-of-tire, rear
  how:    Tape measure / CAD
  why: >
    THE torque-vectoring lever arm: Mz = (t_r/2)*dFx. Bigger track = more yaw
    per N*m of split.

weight_fraction_front:
  label:  "Front weight fraction"
  value:  0.4344
  unit:   "-"
  display_unit: 0-1
  symbol: pct_front
  status: MEASURED 2026-08-31 (scales, NO driver — redo seated)
  what: >
    Static front weight fraction = front axle weight / total weight. By
    statics this equals (CG-to-REAR-axle distance)/wheelbase.
  need: >
    Front axle share WITH DRIVER SEATED (expect ~1-2% lower than the 43.44%
    car-only number, so roughly 41.5-43%)
  how:    Repeat the corner-scale session with the driver in the seat
  why: >
    Decides how much grip each axle owns — understeer/oversteer balance starts
    here.
  note: >
    Corner scales 2026-08-31, NO driver: (87.5+86.3)/400.1 = 43.44% front —
    finally replaces the old report's self-contradictory 46%/58%. ONE STEP
    LEFT: the sim runs WITH a driver, and a seated driver's CG sits aft of
    mid-wheelbase, so the true with-driver front share is lower. Using the
    car-only measurement until the team repeats the weighing seated.

h_cg:
  label:  "CG height"
  value:  0.23
  unit:   m
  symbol: h
  status: FROM REPORT
  what:   Height of the center of gravity above the ground.
  need:   CG height
  how:    Tilt test (weigh one axle while lifting the other) or CAD
  why: >
    Drives ALL load transfer — every grip shift in braking, accel and
    cornering is proportional to h.
  note: >
    Report h = 0.23 m is strictly the SPRUNG-mass CG height, but with unsprung
    CGs at wheel-center height (~0.20 m) the whole-vehicle value works out to
    ~0.226 m, so 0.23 is fine as-is.

I_z:
  label:  "Yaw inertia"
  value:  70.38
  unit:   kg*m^2
  symbol: I_z
  status: FROM REPORT
  what: >
    Yaw moment of inertia of the whole vehicle about the vertical axis through
    the CG. Sets how fast yaw rate responds to the TV yaw moment.
  need:   Yaw moment of inertia
  how:    CAD mass model (practical) or trifilar pendulum test
  why:    Directly in Iz*rdot = sum(Mz) — how fast the car answers a yaw moment.

# ── full plant (vehicle17.py): the other two inertias, CG split, ride heights ─

I_xx:
  label:  "Roll inertia (sprung)"
  value:  15.34
  unit:   kg*m^2
  symbol: I_xx
  status: PLACEHOLDER — team sheet (which car is unconfirmed)
  what:   Roll moment of inertia of the SPRUNG mass about its own longitudinal axis.
  need:   Roll inertia from CAD, driver included
  how:    CAD mass properties
  why:    How fast the body rolls after turn-in; with the roll stiffness it sets the roll natural frequency.

I_yy:
  label:  "Pitch inertia (sprung)"
  value:  64.46
  unit:   kg*m^2
  symbol: I_yy
  status: PLACEHOLDER — team sheet (which car is unconfirmed)
  what:   Pitch moment of inertia of the sprung mass about its lateral axis.
  need:   Pitch inertia from CAD
  how:    CAD mass properties
  why:    Dive/squat dynamics under braking and drive.

I_xz:
  label:  "Roll-yaw product of inertia"
  value:  0.0
  unit:   kg*m^2
  symbol: I_xz
  status: PLACEHOLDER — assumed 0 (symmetric body)
  what:   Product of inertia coupling roll and yaw. Non-zero when the mass is not symmetric about the roll axis (a low-slung battery with a high driver gives a small one).
  need:   I_xz from CAD
  how:    CAD mass properties (full inertia tensor)
  why:    "Couples roll into yaw: a body that rolls also yaws a little, which the TV controller sees as a disturbance."

cg_lateral_offset:
  label:  "CG lateral offset"
  value:  0.0
  unit:   m
  symbol: y_cg
  status: "MEASURED 2026-08-31 (corner scales: 50.56% left -> ~5 mm, taken as 0)"
  what:   Lateral position of the CG from the centreline, positive LEFT.
  need:   "-"
  how:    "Corner scales: (left share - 0.5) x track"
  why:    A non-zero value gives a standing left/right load asymmetry.

h_cg_sprung:
  label:  "Sprung-mass CG height"
  derived: (mass.total * geometry.h_cg - 2.0 * (mass.unsprung_front + mass.unsprung_rear) * suspension.unsprung_cg_height) / mass.sprung
  unit:   m
  symbol: h_s
  status: DERIVED
  what:   Height of the SPRUNG mass's CG above ground, from the whole-vehicle h_cg and the unsprung CGs at wheel-centre height.
  need:   "-"
  how:    = (m_t h_cg - 4 m_u h_u) / m_s
  why:    The lever arm for the elastic (through-the-springs) part of load transfer.

ride_height_front:
  label:  "Front static ride height"
  value:  50.0
  unit:   mm
  symbol: rh_f
  status: PLACEHOLDER — setup sheet
  what:   Ground clearance at the front of the floor at static. Reference for the aero ride-height sensitivity.
  need:   Setup-sheet ride height
  how:    Ruler under the floor, car on flat ground, driver seated
  why:    Aero platform; the full plant's heave is measured from this.

ride_height_rear:
  label:  "Rear static ride height"
  value:  60.0
  unit:   mm
  symbol: rh_r
  status: PLACEHOLDER — setup sheet
  what:   Ground clearance at the rear of the floor at static.
  need:   Setup-sheet ride height
  how:    Ruler
  why:    Aero platform (rake).
