namespace: drivetrain
order: 40
title: "WHEELS & DRIVETRAIN"

about: >
  Wheels, gearing, motors and the power limits.

  Layout (team-confirmed 2026-08-30): FOUR motors fitted, one per wheel (hub
  drive, planetary reduction in each upright). The sim drives all four as of
  2026-09-09; a rear-drive configuration is the same plant with zero front
  torque. See README.md and the four-corner allocator's own params file,
  controllers/python/awd/params.yaml.

  Motors: AMK "Racing Kit" A2370DD (DD5-type synchronous servo) with
  KW26-S5-FSE-4Q inverters — see docs/datasheets/AMK Racing Kit Datasheet.pdf
  (kit manual; exact motor data sheet: Motor_data_sheet_A2370DD_DD5).

tire_outer_diameter:
  label:  "Tire outer diameter"
  value:  18.0
  unit:   in
  display_unit: m (18 in OD)
  symbol: d_w
  status: CURRENT CAR (18in tire OD, 10in rim)
  what:   Outer diameter of the fitted tire. wheel_radius is derived from it.
  need:   Confirmed tire size
  how:    Tire sidewall / team spec
  why:    The rim size does not enter the sim — only the tire's rolling radius does.

wheel_radius:
  label:  "Tire radius (loaded)"
  derived: drivetrain.tire_outer_diameter / 2.0
  unit:   m
  display_unit: m (18 in OD / 2)
  symbol: r_w
  status: CURRENT CAR
  what:   LOADED tire radius — ground to axle center with the car's weight on the tire.
  need:   Axle-center height, car on the ground
  how:    Ruler to the axle center
  why: >
    Converts wheel torque to drive force (F = T/r) and wheel speed to ground
    speed. Loaded radius is a few mm less than free radius (tire squish) —
    measure axle-center height with the car on the ground to refine.

gear_ratio:
  label:  "Upright planetary ratio"
  value:  13.0
  unit:   "-"
  symbol: gr
  status: FROM REPORT — confirm upright planetary ratio
  what: >
    Total reduction between motor shaft and wheel (motor revs per wheel rev).
    With one motor PER WHEEL this is the PLANETARY gear stage packaged in each
    upright with the motor — not a chain or gearbox.
  need:   The planetary's reduction ratio
  how:    Ask powertrain / count gear teeth in CAD
  why: >
    Wheel torque = motor torque * gr; reflected rotor inertia = rotor J * gr^2.
    The 21 N*m motor is useless without it — direct drive would give 92 N of
    drive force per wheel (0.08 g) and a 479 m/s speed match.
  note: >
    Old report gr = 13 (typical AMK-kit planetaries run 12-14.5:1). DESIGN
    CHOICE, not inherited.

motor_torque_peak:
  label:  "Motor peak torque"
  value:  21.0
  unit:   N*m
  symbol: T_pk
  status: CURRENT CAR (AMK kit datasheet)
  what:   Peak torque of ONE motor at its shaft (before the gear reduction).
  need:   Nothing (datasheet value)
  how:    AMK kit manual 6.5.3 torque curve; dyno confirms someday
  why:    x13 gear = 273 N*m per wheel — the ceiling every torque command lives under.

motor_kt:
  label:  "Motor torque constant"
  value:  0.2
  unit:   N*m/A
  symbol: Kt
  status: PLACEHOLDER — UNMEASURED; AMK-era motor numbers above may not apply to the in-hub motors
  what:   Shaft torque per amp of motor (q-axis) current. Turns a VESC current command into torque.
  need:   The in-hub motor's Kt
  how: >
    Motor datasheet, or once VESC status frames are parsed: measured wheel
    torque / (reported motor current x gear ratio). Cross-check against
    motor_torque_peak / peak current.
  why: >
    The ONLY number that makes the VCU's milliamp command mean anything in the
    sim: T_wheel = I[A] * Kt * gear_ratio. At 0.2 the firmware's 125 A
    full-throttle command asks for 325 N*m per wheel, above the 273 N*m peak.



pack_voltage:
  label:  "Pack voltage"
  value:  380.0
  unit:   V
  symbol: V_DC
  status: CURRENT CAR (design decision 2026-08-30)
  what:   Accumulator (HV pack) nominal voltage.
  need:   Nothing (design value)
  how:    Accumulator design
  why: >
    Not used directly by the physics — it SETS motor peak power below.
    4 motors x 20 kW at 380 V = 80 kW, which is EXACTLY the rules cap. That
    leaves the cap zero headroom, so it can never bind: the per-motor power
    limit is the operative constraint at every speed. See power_cap_total.

motor_power_peak:
  label:  "Motor peak power"
  value:  20000.0
  unit:   W
  symbol: P_pk
  status: DERIVED (kit curves scaled to 380 V)
  what:   Peak mechanical power of ONE motor at OUR pack voltage.
  need:   Actual peak power at 380 V
  how:    Read the 380 V curve in the AMK manual; dyno pull once the pack exists
  why: >
    Caps torque above ~17 m/s (37 mph): at 40 mph only 256 of 273 N*m is
    available. Four motors top out at 80 kW — numerically identical to the
    rules cap, so THIS per-motor limit is what actually binds, not the cap.
  note: >
    AMK kit manual 6.5.3 — peak power rides on HV voltage. Curves give ~26 kW
    at 500 VDC and ~32 kW at 600 VDC. Scaled to the 380 V pack three ways:
    26*(380/500) = 19.8 kW, 32*(380/600) = 20.3 kW, base-speed method
    21 N*m * (13 krpm*380/600) = 18.1 kW -> 20 kW adopted.

motor_max_speed:
  label:  "Motor max speed"
  value:  20000
  unit:   rpm
  display_unit: rad/s (entered as 20,000 rpm)
  symbol: n_max
  status: CURRENT CAR (AMK kit datasheet)
  what:   Maximum motor shaft speed.
  need:   Nothing (datasheet value)
  how:    AMK kit manual 6.5.3 (characteristics end at 20,000 rpm)
  why: >
    ~36 m/s (80 mph) ground speed at 13:1 — comfortably above the 40 mph
    envelope, not the limiter. NOT enforced by this basic sim; recorded for
    completeness and future top-speed studies.

I_wheel_rear:
  label:  "Wheel spin inertia, rear corner"
  value:  0.35
  unit:   kg*m^2
  symbol: I_w,r
  status: DERIVED estimate — replace with CAD
  what: >
    Spin inertia of ONE REAR corner about the axle: tire + rim + brake rotor +
    hub + (motor rotor inertia * gear_ratio^2).
  need:   Rotating inertia of one rear corner
  how:    CAD mass properties + rotor J from the exact AMK motor sheet
  why: >
    Sets how fast an unloaded wheel spins up — the s-diff's whole problem.
    Controller gains are sensitive to it: retune when it changes. Together with
    I_wheel_front it also sets the effective mass the car must accelerate,
    which verify.py D1 measures against a closed-form coast-down.
  note: >
    Estimate = tire+rim+hub ~0.30 (guess for an 18in tire on a 10in rim) +
    rotor inertia * gear^2 ~ 2.74e-4 * 13^2 ~ 0.05. The old report's
    I_w = 3.033 was rejected: ~10x too large for one corner. Renamed from
    `I_wheel` on 2026-09-08 when the sim gained front wheel-spin states; the
    VALUE is unchanged.

I_wheel_front:
  label:  "Wheel spin inertia, front corner"
  derived: drivetrain.I_wheel_rear
  unit:   kg*m^2
  symbol: I_w,f
  status: DERIVED — front corner ASSUMED identical to rear; replace when CAD says otherwise
  what: >
    Spin inertia of ONE FRONT corner about the axle. Same construction as the
    rear — same tire, same rim, same in-upright motor and planetary, same brake
    rotor — so the same number, written as a formula so the ASSUMPTION is
    visible in the data rather than buried in code.
  need:   Rotating inertia of one front corner (CAD)
  how:    CAD mass properties on the front upright assembly
  why: >
    The front rotor spins whether or not that motor is energised, so this
    number is real for the 2-rear build too. It is the term the sim dropped
    when it called the fronts "massless free-rollers": worth
    2*I/r_w^2 = 13.4 kg of apparent mass, 5.3% of the car, and 0.6% on a 3 s
    coast-down.

power_cap_total:
  label:  "Total power cap"
  value:  80000.0
  unit:   W
  symbol: P_max
  status: RULES VALUE (simplified)
  what:   FSAE EV rules limit on total drive power (EV.4.2, 80 kW at the accumulator).
  need:   Nothing (rulebook)
  how:    Confirm in the current-year rulebook
  why: >
    Hard ceiling. The sim applies it to mechanical power (no drivetrain losses
    modeled) — the real car hits it ~10-15% earlier.
    PRESENTLY UNREACHABLE: driven_wheels * motor_power_peak == this value
    exactly, so the per-motor clip already implies it and the total-cap branch
    is dead code (verify F16 reports the zero headroom). It becomes live the
    moment motor_power_peak is revised upward — that number is DERIVED from kit
    curves by three methods spanning 18.1-20.3 kW — or if driveline losses are
    ever modelled, since the rules limit is electrical at the accumulator while
    this one is applied to mechanical power.

driven_wheels:
  label:  "Driven wheels"
  value:  4
  unit:   "-"
  symbol: n_drv
  status: CURRENT CAR (four motors fitted, one per upright)
  what: >
    How many wheels receive drive torque. 4 = one motor per upright; 2 = the
    rear pair only, which is what the current build runs.
  need:   Which inverters are commissioned on the car
  how:    "Powertrain: count enabled inverters"
  why: >
    The scale between "peak torque at ONE wheel" and "peak torque the driver
    can ask for". Every axle-torque budget in the sim is n_drv * T_wheel_max:
    the maneuver throttle steps, the APPS pedal map, the driver adapter's
    exact inverse of it, and the plot ceilings.
  note: >
    NOT used by the plant. The plant has four wheel-torque inputs and a
    rear-drive car is simply zero front torque — this number only sets how
    much torque the DRIVER's 100% pedal means.

regen_speed_cutoff:
  label:  "Regen speed cutoff"
  value:  1.4
  unit:   m/s
  display_unit: m/s (~5 km/h)
  symbol: "-"
  status: RULES VALUE (approx.)
  what:   Below this speed no negative (regen) torque is commanded.
  need:   Nothing (rulebook)
  how:    Confirm in the current-year rulebook
  why: >
    Rules restrict regen near standstill; also keeps the sim's low-speed slip
    math out of its untrustworthy zone.
