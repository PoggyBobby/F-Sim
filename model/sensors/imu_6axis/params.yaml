namespace: sensors.imu_6axis
order: 95
title: "SENSORS — IMU, yaw gyro and accelerometers"

about: >
  IMU — yaw-rate gyro and the ax/ay accelerometer channels, plus the
  first-order low-pass the VCU applies to the gyro before feedback.

gyro_noise_std:
  label:  "IMU gyro noise (1σ)"
  value:  0.3
  unit:   deg/s
  display_unit: rad/s (entered as deg/s, 1 sigma)
  symbol: sigma_g
  status: PLACEHOLDER — IMU spec
  what:   Yaw-gyro 1-sigma noise.
  need:   IMU datasheet numbers
  how:    Chosen IMU's spec sheet
  why:    Goes straight into the TV feedback — sets how clean the yaw control can be.

gyro_bias:
  label:  "IMU gyro bias"
  value:  0.1
  unit:   deg/s
  display_unit: rad/s (entered as deg/s)
  symbol: b_g
  status: PLACEHOLDER — uncalibrated bias
  what:   Constant yaw-gyro zero offset.
  need:   IMU datasheet numbers
  how:    Chosen IMU's spec sheet, then a stationary calibration on the car
  why:    Biases the yaw-rate error the TV controller integrates.

lpf_hz:
  label:  "VCU gyro low-pass"
  value:  20.0
  unit:   Hz
  symbol: f_c
  status: PLACEHOLDER — VCU filter choice
  what:   First-order low-pass the VCU applies to the gyro before feedback.
  need:   "-"
  how:    Software choice; tune against noise
  why:    "Trade: more filtering = less dither but more phase lag in the yaw loop."

accel_noise_std:
  label:  "IMU accel noise"
  value:  0.05
  unit:   m/s^2
  symbol: sigma_a
  status: PLACEHOLDER — IMU spec
  what:   Accelerometer 1-sigma noise (ax, ay channels).
  need:   IMU datasheet
  how:    Spec sheet
  why:    Feeds future estimation (vx observer, validation logging).
