namespace: sensors.imu_6axis
order: 95
title: "SENSORS — IMU, yaw gyro and accelerometers"

about: >
  IMU — yaw-rate gyro and the ax/ay accelerometer channels, plus the
  first-order low-pass the VCU applies to the gyro before feedback.

gyro_noise_std:
  label:  "IMU gyro noise (1σ)"
  value:  0.025
  unit:   deg/s
  display_unit: rad/s (entered as deg/s, 1 sigma)
  symbol: sigma_g
  status: PLACEHOLDER — VectorNav VN-100 datasheet value from memory (0.0035 deg/s/sqrt(Hz) x sqrt(50 Hz)); VERIFY against the sheet
  what:   Yaw-gyro 1-sigma noise per 100 Hz sample. The car's IMU is a VN-100 (team sensor slide 75).
  need:   Confirm the VN-100 noise density on its datasheet
  how:    "VN-100 datasheet: noise density x sqrt(VCU bandwidth)"
  why:    Goes straight into the TV feedback — sets how clean the yaw control can be.

gyro_bias:
  label:  "IMU gyro bias"
  value:  0.003
  unit:   deg/s
  display_unit: rad/s (entered as deg/s)
  symbol: b_g
  status: PLACEHOLDER — VN-100 in-run bias stability (~10 deg/hr) from memory; VERIFY, then calibrate on the car
  what:   Constant yaw-gyro zero offset left after the VN-100's own calibration.
  need:   Stationary log on the car
  how:    VN-100 datasheet bias stability, then a stationary calibration on the car
  why:    Biases the yaw-rate error the TV controller integrates.

lpf_hz:
  label:  "VCU gyro low-pass"
  value:  20.0
  unit:   Hz
  symbol: f_c
  status: PLACEHOLDER — VCU filter choice
  what:   First-order low-pass the VCU applies to the gyro before feedback.
  need:   "-"
  how:    Software choice; tune against noise
  why:    "Trade: more filtering = less dither but more phase lag in the yaw loop."

accel_noise_std:
  label:  "IMU accel noise"
  value:  0.01
  unit:   m/s^2
  symbol: sigma_a
  status: PLACEHOLDER — VN-100 datasheet value from memory (0.14 mg/sqrt(Hz) x sqrt(50 Hz)); VERIFY
  what:   Accelerometer 1-sigma noise per 100 Hz sample (ax, ay channels). The car's IMU is a VN-100 (team sensor slide 75).
  need:   Confirm the VN-100 accel noise density on its datasheet
  how:    "VN-100 datasheet: noise density x sqrt(VCU bandwidth)"
  why:    Feeds future estimation (vx observer, validation logging).

# ── full plant (vehicle17.py): the accelerometer bias state and the mount ───

accel_bias_walk:
  label:  "Accelerometer bias random walk"
  value:  0.001
  unit:   m/s^2/sqrt(s)
  symbol: q_ax
  status: PLACEHOLDER — "super accurate" assumption
  what:   Strength of the slowly wandering longitudinal-accelerometer bias (one of the 80 plant states).
  need:   Allan deviation from a static log
  how:    Static log of the IMU for ~10 minutes
  why:    The bias the EKF estimates; integrates into speed-estimate drift.

pos_x:
  label:  "IMU x (from CG)"
  value:  0.0
  unit:   m
  symbol: x_imu
  status: PLACEHOLDER — CAD
  what:   IMU position relative to the CG, positive forward. The accelerometer measures the specific force AT the IMU, not at the CG.
  need:   IMU mounting position
  how:    CAD
  why:    An IMU ahead of the CG reads yaw acceleration as lateral acceleration.

pos_y:
  label:  "IMU y (from CG)"
  value:  0.0
  unit:   m
  symbol: y_imu
  status: PLACEHOLDER — CAD
  what:   IMU position relative to the CG, positive left.
  need:   IMU mounting position
  how:    CAD
  why:    "Off-centre: yaw acceleration appears as longitudinal acceleration."

pos_z:
  label:  "IMU z (from CG)"
  value:  0.1
  unit:   m
  symbol: z_imu
  status: PLACEHOLDER — CAD
  what:   IMU height relative to the CG, positive up.
  need:   IMU mounting position
  how:    CAD
  why:    Above the CG the IMU reads roll acceleration as lateral acceleration.
