namespace: sensors.throttle_pos

about: >
  APPS — accelerator pedal position sensor. The pedal map is linear:
  APPS % -> torque request, 100% = full axle torque (2 x T_wheel_max).

quant_pct:
  value:  0.5
  unit:   "%/LSB"
  symbol: "-"
  status: PLACEHOLDER — sensor spec
  what:   Accelerator pedal position resolution.
  need:   APPS sensor spec
  how:    Datasheet
  why:    Torque request granularity.
