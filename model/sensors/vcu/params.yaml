namespace: sensors.vcu
order: 90
title: "SENSORS & VCU — the VCU itself"

about: >
  The VCU itself — loop rate, the rules plausibility thresholds, and the noise
  seed. Not a sensor, but the thing that reads all of them.

rate_hz:
  label:  "VCU loop rate"
  value:  100.0
  unit:   Hz
  symbol: "-"
  status: PLACEHOLDER — ask software team
  what: >
    VCU control-loop rate — how often sensors are sampled and torque commands
    are recomputed (physics still integrates at 4 kHz).
  need:   The real VCU loop rate
  how:    Software team
  why: >
    Gains proven stable at 100 Hz (verify.py section H); make it match reality
    before quoting controller performance.

plaus_apps_cut:
  label:  "Plausibility cut threshold"
  value:  25.0
  unit:   "%"
  symbol: "-"
  status: RULES VALUE (EV.4.7)
  what:   APPS percentage above which, while braking, motor power must be cut.
  need:   "-"
  how:    Rulebook (confirm current year)
  why:    Implemented and unit-tested (verify I3); the pedal_check maneuver demonstrates it.

plaus_apps_restore:
  label:  "Plausibility restore threshold"
  value:  5.0
  unit:   "%"
  symbol: "-"
  status: RULES VALUE (EV.4.7)
  what:   APPS percentage the pedal must fall below before power is restored.
  need:   "-"
  how:    Rulebook (confirm current year)
  why:    The latch that makes the cut a latch and not a flicker.

seed:
  label:  "Sensor noise seed"
  value:  2026
  unit:   "-"
  symbol: "-"
  status: NUMERICAL GUARD (repeatability)
  what: >
    Seed for the sensor-noise generator — runs are exactly repeatable and all
    four controller configs see IDENTICAL noise.
  need:   "-"
  how:    "-"
  why:    Fair comparisons and reproducible runs.

vx_tau:
  label:  "vx estimator time constant"
  value:  0.15
  unit:   s
  symbol: tau_vx
  status: TUNED (sim)
  what:   How fast the wheel-speed measurement pulls the ground-speed estimate.
  need:   "-"
  how:    Corner exit at high throttle — shortest tau that still rides out a spin event
  why: >
    Short enough that the estimate cannot drift far on the accelerometer alone,
    long enough that one quantization LSB of wheel speed does not shake the
    slip ratios a traction guard reads. Applied as dt/(dt+tau), so the filter
    behaves identically at the 100 Hz VCU rate and the 4 kHz rate verify I4 uses.

vx_spread_ref:
  label:  "Wheel-speed scatter reference"
  value:  1.5
  unit:   m/s
  symbol: "-"
  status: TUNED (sim)
  what: >
    Spread between fastest and slowest wheel (as ground speed) at which the
    estimator stops trusting the wheels and coasts on the accelerometer.
  need:   "-"
  how:    Track tests — the largest HONEST spread that corner geometry produces
  why: >
    With four DRIVEN wheels there is no undriven reference left: under power
    every wheel over-reads, so min(w)*r_wheel is no longer a lower bound on
    ground speed. Scatter is the signal that says "some corner is slipping".
    1.5 m/s sits above the r*track difference real cornering produces (about
    0.6 m/s at 1 rad/s) and below a genuine spin event.

